name: Secrets

# Secret scanning in CI.
#
# The scan is inlined here rather than calling the organisation's shared
# reusable workflow, because a public repository cannot call a reusable
# workflow that lives in a private or internal one. The rules live in this
# repository's own .gitleaks.toml; keep it in step with the organisation
# default when that changes.
#
# Behaviour:
#   pull_request  scan only the commits the PR adds, FAIL on a finding
#   push/schedule scan full history, report, never fail
# --redact always: a secret in a build log has leaked again, somewhere with
# looser access control than the repo it came from.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "41 8 * * 1"

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -uo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Resolve scan range
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "log_opts=--no-merges ${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            # Also the fallback when a force-push leaves the recorded base
            # unreachable: scan everything rather than silently scanning nothing.
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "log_opts=" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan for secrets
        id: scan
        env:
          LOG_OPTS: ${{ steps.plan.outputs.log_opts }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          set -uo pipefail
          # --exit-code 0: the gate decision happens in a later step so a
          # finding still produces a summary before the build fails.
          if [ "$MODE" = "diff" ]; then
            # shellcheck disable=SC2086 # LOG_OPTS is deliberately word-split
            "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml \
              --redact --exit-code 0 --report-format json \
              --report-path "$RUNNER_TEMP/gitleaks-report.json" --log-opts "$LOG_OPTS"
          else
            "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml \
              --redact --exit-code 0 --report-format json \
              --report-path "$RUNNER_TEMP/gitleaks-report.json"
          fi
          count=0
          if [ -s "$RUNNER_TEMP/gitleaks-report.json" ]; then
            count=$(jq 'length' "$RUNNER_TEMP/gitleaks-report.json" 2>/dev/null || echo 0)
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        env:
          COUNT: ${{ steps.scan.outputs.count }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          set -uo pipefail
          case "${MODE:-}" in
            diff) label="the commits this pull request adds" ;;
            full) label="full repository history" ;;
            *)    label="unknown scope" ;;
          esac
          {
            echo "## Secret scan"
            echo ""
            echo "Scanned: ${label}."
            echo ""
            if [ "${COUNT:-0}" = "0" ]; then
              echo "No findings."
            else
              echo "**${COUNT} finding(s).** Values are redacted; rule, file and line only:"
              echo ""
              echo "| Rule | File | Line | Commit |"
              echo "| --- | --- | --- | --- |"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:8]) |"' \
                "$RUNNER_TEMP/gitleaks-report.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on findings
        if: ${{ steps.plan.outputs.mode == 'diff' && steps.scan.outputs.count != '0' }}
        run: |
          echo "::error::gitleaks found ${{ steps.scan.outputs.count }} secret(s) in the commits this PR adds."
          echo "Rotate the credential FIRST — it is compromised the moment it is pushed, and"
          echo "removing it from the branch does not un-leak it. Then remove it from the diff."
          echo "If it is a fixture, allowlist it in .gitleaks.toml with a comment saying why."
          exit 1

      - name: Report findings without failing (full-history mode)
        if: ${{ steps.plan.outputs.mode == 'full' && steps.scan.outputs.count != '0' }}
        run: |
          echo "::warning::gitleaks found ${{ steps.scan.outputs.count }} secret(s) in history; not failing. Historical leaks need a rotation ticket, not a red build."
