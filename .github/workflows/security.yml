name: Security
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  security:
    uses: smplify-mdm/com.smplify.infra/.github/workflows/security-scan.yml@d46fe708117b12d4619e1b1d46956cf04c3f97d2 # infra master @ 2026-07-29
    with:
      language: other
      advisory: true          # flipped to false in step 6
      emit-baseline: true     # removed in step 6
      ticket-mode: dry-run
    secrets:
      infra-app-id: ${{ secrets.CI_DEP_APP_ID }}
      infra-app-private-key: ${{ secrets.CI_DEP_APP_PRIVATE_KEY }}
