name: Security
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  security:
    uses: smplify-mdm/com.smplify.infra/.github/workflows/security-scan.yml@5872e5b731472f7bd5ab9f3355c347a982384221 # infra master @ 2026-07-29 (post-hotfix)
    with:
      language: other
      advisory: true          # flipped to false in step 6
      emit-baseline: true     # removed in step 6
      ticket-mode: dry-run
    secrets:
      infra-app-id: ${{ secrets.CI_DEP_APP_ID }}
      infra-app-private-key: ${{ secrets.CI_DEP_APP_PRIVATE_KEY }}
